name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .

  test:
    # ubuntu-latest is 26.04, which has no Python 3.9; 24.04 still does.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=presidio_opcua --cov-report=term-missing --cov-fail-under=85

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package and pip-audit
        # No lock file: audit what a fresh install resolves, i.e. what users get.
        # pip is upgraded first so a stale runner pip is not reported as ours.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pip-audit==2.10.1"
      - name: Run pip-audit
        # Ignores only the unexpired advisories in audit-exceptions.txt (today
        # PYSEC-2026-888, CVE-2022-25304: no upstream fix, mitigated on import, see
        # SECURITY.md#known-issues). Any other finding, or an expired entry, fails the job.
        run: |
          today=$(date -u +%F)
          ignore=()
          while read -r id scope kind expires rest; do
            case "$id" in ""|"#"*|"@"*) continue ;; esac
            if [[ "$expires" < "$today" ]]; then
              echo "::warning::audit-exceptions.txt: $id expired on $expires and is no longer ignored"
              continue
            fi
            ignore+=(--ignore-vuln "$id")
          done < audit-exceptions.txt
          pip-audit --progress-spinner=off --skip-editable "${ignore[@]}"
