name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .

  test:
    # ubuntu-latest is 26.04, which has no Python 3.9; 24.04 still does.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=presidio_opcua --cov-report=term-missing --cov-fail-under=85

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package and pip-audit
        # No lock file: audit what a fresh install resolves, i.e. what users get.
        # pip is upgraded first so a stale runner pip is not reported as ours.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pip-audit==2.10.1"
      - name: Run pip-audit
        # PYSEC-2026-888 (CVE-2022-25304) affects every opcua release and has no fix
        # upstream. This package bounds chunk size, chunk count and message size on
        # import, so the DoS is mitigated here (SECURITY.md#known-issues). Any other
        # finding fails the job.
        run: pip-audit --progress-spinner=off --skip-editable --ignore-vuln PYSEC-2026-888
